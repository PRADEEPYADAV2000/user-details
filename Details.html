<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture User Details</title>
</head>
<body>
    <h1>User Details</h1>
    <div id="user-details">
        <p><strong>Battery Level:</strong> <span id="battery-level">Loading...</span></p>
        <p><strong>Charging Status:</strong> <span id="charging-status">Loading...</span></p>
        <p><strong>System Information:</strong> <span id="system-info">Loading...</span></p>
        <p><strong>Geolocation:</strong> <span id="geolocation">Loading...</span></p>
        <p><strong>Network Information:</strong> <span id="network-info">Loading...</span></p>
        <p><strong>Screen Details:</strong> <span id="screen-details">Loading...</span></p>
        <p><strong>Date and Time:</strong> <span id="date-time">Loading...</span></p>
    </div>
    <button id="save-data">Save Data</button>

    <script>
        const data = {};

        // Get Battery Level
        async function getBatteryLevel() {
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                data.batteryLevel = (battery.level * 100).toFixed(0) + '%';
                data.chargingStatus = battery.charging ? "Charging" : "Not Charging";
                document.getElementById("battery-level").textContent = data.batteryLevel;
                document.getElementById("charging-status").textContent = data.chargingStatus;
            } else {
                data.batteryLevel = "Battery API not supported.";
                document.getElementById("battery-level").textContent = data.batteryLevel;
            }
        }

        // Get System Information
        function getSystemInfo() {
            data.systemInfo = {
                platform: navigator.platform,
                userAgent: navigator.userAgent,
            };
            document.getElementById("system-info").textContent =
                `Platform: ${data.systemInfo.platform}, User Agent: ${data.systemInfo.userAgent}`;
        }

        // Get Geolocation
        function getGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        data.geolocation = { latitude, longitude, accuracy };
                        document.getElementById("geolocation").textContent =
                            `Latitude: ${latitude}, Longitude: ${longitude}, Accuracy: ${accuracy}m`;
                    },
                    (error) => {
                        data.geolocation = `Error: ${error.message}`;
                        document.getElementById("geolocation").textContent = data.geolocation;
                    }
                );
            } else {
                data.geolocation = "Geolocation not supported.";
                document.getElementById("geolocation").textContent = data.geolocation;
            }
        }

        // Get Network Information
        function getNetworkInfo() {
            if (navigator.connection) {
                const { effectiveType, downlink } = navigator.connection;
                data.networkInfo = { effectiveType, downlink: `${downlink} Mbps` };
                document.getElementById("network-info").textContent =
                    `Type: ${effectiveType}, Downlink: ${downlink} Mbps`;
            } else {
                data.networkInfo = "Network API not supported.";
                document.getElementById("network-info").textContent = data.networkInfo;
            }
        }

        // Get Screen Details
        function getScreenDetails() {
            data.screenDetails = {
                resolution: `${window.screen.width}x${window.screen.height}`,
                pixelRatio: window.devicePixelRatio,
            };
            document.getElementById("screen-details").textContent =
                `Resolution: ${data.screenDetails.resolution}, Pixel Ratio: ${data.screenDetails.pixelRatio}`;
        }

        // Get Date and Time
        function getDateTime() {
            const now = new Date();
            data.dateTime = now.toString();
            document.getElementById("date-time").textContent = data.dateTime;
        }

        // Save Data to server
        function saveData() {
            fetch('http://localhost:3000/store-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.text())
            .then(result => {
                console.log(result);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        document.getElementById("save-data").addEventListener("click", saveData);

        // Run functions on page load
        document.addEventListener("DOMContentLoaded", () => {
            getBatteryLevel();
            getSystemInfo();
            getGeolocation();
            getNetworkInfo();
            getScreenDetails();
            getDateTime();
        });
    </script>
</body>
</html>
